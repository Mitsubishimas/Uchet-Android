<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Учёт MasterMitsu</title>
  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <img class="logotype" src="img/logo.png" alt="MasterMitsu" width="88" height="44" />
      <span class="topbar__title" id="screen-title">Рабочий стол</span>
    </header>
    <main id="main" class="main"></main>
    <nav class="bottom-nav" aria-label="Разделы">
      <button type="button" class="nav-item is-active" data-tab="home">
        <span class="nav-item__icon">⌂</span>
        <span class="nav-item__label">Стол</span>
      </button>
      <button type="button" class="nav-item" data-tab="new">
        <span class="nav-item__icon">＋</span>
        <span class="nav-item__label">Заказ</span>
      </button>
      <button type="button" class="nav-item" data-tab="list">
        <span class="nav-item__icon">☰</span>
        <span class="nav-item__label">Список</span>
      </button>
      <button type="button" class="nav-item" data-tab="report">
        <span class="nav-item__icon">▦</span>
        <span class="nav-item__label">Отчёт</span>
      </button>
    </nav>
    <div id="toast" class="toast" hidden></div>
  </div>
  <script src="js/db.js"></script>
  <script src="js/domain.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
